<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Master Data</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='index.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Upload Excel File</h1>          
          <!-- Rounded switch -->
          <!-- <label class="switch">
            <input type="checkbox">
            <span class="slider round"></span>
          </label> -->
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="base-url-container">
                <label for="base_url">Base URL:</label>
                <input type="text" id="base_url" name="base_url" required style="margin-top: -18px; margin-top: -35px; margin-bottom: 5px;">
            </div>
            <div>
                <span class="clssub">
                  <div class="clsdownload"><a href=/download><i class="fa fa-download clsicon" aria-hidden="false"> </i></a></div>
                </span>
            </div>
            <div>
                <label id="lblfileUpload" for="file">Excel File:</label>
                <input type="file" id="file" name="file" accept=".xlsx" required>
            </div>
            <div>
                <button type="submit" id="btnSubmit">Upload</button>
            </div>
        </form>
        <div id="result"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='index.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
